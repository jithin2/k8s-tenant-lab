# LAB ONLY: nginx pretends to be the REST API and returns the version.
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-conf
  annotations:
    argocd.argoproj.io/sync-wave: "2"
data:
  default.conf: |
    server {
      listen 8080;
      location /api/version {
        default_type application/json;
        return 200 '{"tenant":"{{ .Values.tenant.name }}","version":"{{ .Values.version }}"}';
      }
      location /healthz {
        return 200 'ok';
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        version: {{ .Values.version | quote }}
      annotations:
        config-hash: {{ printf "%s-%s" .Values.tenant.name .Values.version | sha256sum | trunc 12 | quote }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
      containers:
      - name: backend
        image: nginxinc/nginx-unprivileged:1.27-alpine
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        volumeMounts:
        - name: conf
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
      volumes:
      - name: conf
        configMap:
          name: backend-conf
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    app: backend
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: {{ (index .Values.sizes .Values.size).backendMax }}
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: backend
