# Runs on every pull request and every push to main.
# Same rules as the cluster, checked before anything is merged.
name: pr-checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  tenant-files:
    name: Check tenant files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2
      - run: python ci/check_tenants.py

  render-and-policy:
    name: Render chart and test policies
    runs-on: ubuntu-latest
    needs: tenant-files
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Install kubeconform and Kyverno CLI
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          curl -sSL https://github.com/kyverno/kyverno/releases/download/v1.13.4/kyverno-cli_v1.13.4_linux_x86_64.tar.gz | tar xz kyverno
          sudo mv kubeconform kyverno /usr/local/bin/
      - name: Helm lint
        run: helm lint chart/tenant-app
      - name: Render one copy per tenant
        run: python ci/render_all.py
      - name: Check Kubernetes schemas
        run: kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.31.0 rendered/acme.yaml rendered/bolt.yaml rendered/contoso.yaml
      - name: Test Kyverno policies against what we would deploy
        run: kyverno apply kyverno/no-root.yaml --resource rendered/ --values-file rendered/kyverno-values.yaml
